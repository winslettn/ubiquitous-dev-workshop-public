<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>About</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Student Body Statistics</h1>
<table border="1" cellpadding="4">
    <thead>
    <tr><th>Enrollment Date</th><th>Student Count</th></tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${enrollmentCounts}">
        <td th:text="${entry.key}">date</td>
        <td th:text="${entry.value}">0</td>
    </tr>
    </tbody>
</table>
</body>
</html>
