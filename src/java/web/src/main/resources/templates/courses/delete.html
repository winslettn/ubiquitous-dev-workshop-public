<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Delete Course</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Delete Course</h1>
<p>Are you sure you want to delete <strong th:text="${course.title}">course</strong>?</p>
<form th:action="@{|/courses/${course.courseId}/delete|}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Delete</button>
</form>
<p><a th:href="@{/courses}">Back to List</a></p>
</body>
</html>
