<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Student Details</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Student Details</h1>
<p><strong>Last Name:</strong> <span th:text="${student.lastName}"></span></p>
<p><strong>First Name:</strong> <span th:text="${student.firstMidName}"></span></p>
<p><strong>Enrollment Date:</strong> <span th:text="${student.enrollmentDate}"></span></p>
<p><a th:href="@{|/students/${student.id}/edit|}">Edit</a> | <a th:href="@{/students}">Back to List</a></p>
</body>
</html>
