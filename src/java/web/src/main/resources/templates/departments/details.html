<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Department Details</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Department Details</h1>
<p><strong>Name:</strong> <span th:text="${department.name}"></span></p>
<p><strong>Budget:</strong> <span th:text="${department.budget}"></span></p>
<p><strong>Start Date:</strong> <span th:text="${department.startDate}"></span></p>
<p><strong>Administrator:</strong> <span th:text="${department.administrator == null ? '' : department.administrator.fullName}"></span></p>
<p><a th:href="@{|/departments/${department.departmentId}/edit|}">Edit</a> | <a th:href="@{/departments}">Back to List</a></p>
</body>
</html>
