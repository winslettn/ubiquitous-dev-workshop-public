<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Delete Department</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Delete Department</h1>
<p>Are you sure you want to delete <strong th:text="${department.name}">department</strong>?</p>
<form th:action="@{|/departments/${department.departmentId}/delete|}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">Delete</button>
</form>
<p><a th:href="@{/departments}">Back to List</a></p>
</body>
</html>
