<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Create Department</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Create Department</h1>
<form th:action="@{/departments/create}" th:object="${department}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <p>Name: <input th:field="*{name}"></p>
    <p>Budget: <input type="number" step="0.01" th:field="*{budget}"></p>
    <p>Start Date: <input type="date" th:field="*{startDate}"></p>
    <p>
        Administrator:
        <select th:field="*{administrator.id}">
            <option value="">-- none --</option>
            <option th:each="i : ${instructors}" th:value="${i.id}" th:text="${i.fullName}"></option>
        </select>
    </p>
    <button type="submit">Create</button>
</form>
<p><a th:href="@{/departments}">Back to List</a></p>
</body>
</html>
