<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Departments</title></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<h1>Departments</h1>
<p><a th:href="@{/departments/create}">Create New</a></p>
<table border="1" cellpadding="4">
    <thead>
    <tr><th>Name</th><th>Budget</th><th>Start Date</th><th>Administrator</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="department : ${departments}">
        <td th:text="${department.name}"></td>
        <td th:text="${department.budget}"></td>
        <td th:text="${department.startDate}"></td>
        <td th:text="${department.administrator == null ? '' : department.administrator.fullName}"></td>
        <td>
            <a th:href="@{|/departments/${department.departmentId}|}">Details</a> |
            <a th:href="@{|/departments/${department.departmentId}/edit|}">Edit</a> |
            <a th:href="@{|/departments/${department.departmentId}/delete|}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
