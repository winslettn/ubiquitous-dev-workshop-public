name: OctoSupply API TypeScript

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - src/api-ts/**
      - src/database/**
      - .github/workflows/octosupply-api-ts-ci.yml
  pull_request:
    branches: [ "main" ]
    paths:
      - src/api-ts/**
      - src/database/**
      - .github/workflows/octosupply-api-ts-ci.yml

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api-ts
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/api-ts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload coverage report
        if: >
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: src/api-ts/coverage/cobertura-coverage.xml
          language: JavaScript
          label: API TypeScript
