name: OctoSupply API Python

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - src/api-py/**
  #     - .github/workflows/octosupply-api-py-ci.yml
  # pull_request:
  #   paths:
  #     - src/api-py/**
  #     - .github/workflows/octosupply-api-py-ci.yml

permissions:
  contents: read
  code-quality: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api-py
    steps:
      - uses: actions/checkout@v7
      - name: Use Python 3.13
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/api-py/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov
      - name: Run tests with coverage
        run: python -m pytest --cov=. --cov-report=xml:coverage/cobertura-coverage.xml
      - name: Upload coverage report
        if: >
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: src/api-py/coverage/cobertura-coverage.xml
          language: Python
          label: API Python
